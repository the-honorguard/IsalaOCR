consistency_rules:
- name: lv_stroke_equals_ed_minus_es
  kind: difference
  target: lv_stroke_volume
  left: lv_ed_volume
  right: lv_es_volume
  absolute_tolerance: 4.0
  relative_tolerance: 0.08
- name: lv_ef_matches_stroke_over_ed
  kind: ratio_percent
  target: lv_ejection_fraction
  left: lv_stroke_volume
  right: lv_ed_volume
  absolute_tolerance: 5.0
  relative_tolerance: 0.08
- name: rv_stroke_equals_ed_minus_es
  kind: difference
  target: rv_stroke_volume
  left: rv_ed_volume
  right: rv_es_volume
  absolute_tolerance: 4.0
  relative_tolerance: 0.08
- name: rv_ef_matches_stroke_over_ed
  kind: ratio_percent
  target: rv_ejection_fraction
  left: rv_stroke_volume
  right: rv_ed_volume
  absolute_tolerance: 5.0
  relative_tolerance: 0.08
dynamic_extraction:
  enabled: true
  right_panel_titles:
  - Right ventricle Volume Result
  value_headers:
  - Endo Volume
  normal_headers:
  - Normal Values
  panel_search_x2: 650
  header_search_x1: 130
  header_search_x2: 650
  fallback_label_column:
  - 0
  - 175
  fallback_value_column:
  - 175
  - 390
  fallback_panel_divider: 0.55
  panel_title_threshold: 0.68
  header_match_threshold: 0.62
  label_match_threshold: 0.72
  header_left_padding: 35
  normal_column_gap: 15
  row_half_height: 13
  value_padding: 5
  fallback_to_fixed_roi: true
