[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isala-ocr-local"
version = "3.14.1"
description = "Fully local, privacy-conscious OCR extraction for DICOM screenshots"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary - internal evaluation" }
authors = [{ name = "IsalaOCR project" }]
dependencies = [
  "numpy==1.26.4",
  "opencv-python-headless>=4.10,<5",
  "pydicom>=3.0,<4",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
  "rapidfuzz>=3,<4",
]


[project.optional-dependencies]
training = [
  "Flask>=3.1,<4",
  "waitress>=3.1,<4",
]
paddle = [
  "pandas>=2.2,<2.3",
  "paddleocr[doc-parser]==3.7.0",
  "paddlepaddle==3.2.0",
]
dicom-compressed = [
  "pylibjpeg>=2,<3",
  "pylibjpeg-libjpeg>=2,<3",
  "pylibjpeg-openjpeg>=2,<3",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
isala-ocr = "isala_ocr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"isala_ocr.training" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
