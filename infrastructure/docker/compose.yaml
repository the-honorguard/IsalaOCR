name: ${ISALA_COMPOSE_PROJECT_NAME:-isalaocr_docker2}

networks:
  local-label-ui:
    name: isalaocr-label-ui-v340
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

x-runtime-build: &runtime-build
  context: ../..
  dockerfile: infrastructure/docker/Dockerfile.runtime

x-runtime-security: &runtime-security
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-training-environment: &training-environment
  HOME: /tmp
  TMPDIR: /tmp
  PADDLE_PDX_CACHE_HOME: /models/paddlex
  PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
  PADDLE_PDX_LOCAL_FONT_FILE_PATH: /opt/isala-training-resources/DejaVuSans.ttf

x-training-cpu-build: &training-cpu-build
  context: ../..
  dockerfile: infrastructure/docker/Dockerfile.training
  args:
    BASE_IMAGE: ${PADDLEX_CPU_IMAGE:-ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlex/paddlex:paddlex3.3.11-paddlepaddle3.2.0-cpu}
    PADDLEX_SOURCE_VERSION: ${PADDLEX_SOURCE_VERSION:-3.7.2}
    PADDLEX_SOURCE_URL: ${PADDLEX_SOURCE_URL:-https://files.pythonhosted.org/packages/dd/96/1e86d4056ffc1e494c53aebab7e2faf08dcf8b929180f9872ae46632e9bd/paddlex-3.7.2.tar.gz}
    PADDLEX_SOURCE_SHA256: ${PADDLEX_SOURCE_SHA256:-6a60b4595e2d51460f7f51326672adca86b89ff9ecfd02ac348fb69739e0093c}
    PADDLE_PACKAGE: ${PADDLE_CPU_PACKAGE:-paddlepaddle==3.2.2}
    PADDLE_INDEX_URL: ${PADDLE_CPU_INDEX_URL:-https://www.paddlepaddle.org.cn/packages/stable/cpu/}
    INSTALL_PADDLEDETECTION: "1"
    APP_UID: ${ISALA_APP_UID:-10001}
    APP_GID: ${ISALA_APP_GID:-10001}

x-training-gpu-build: &training-gpu-build
  context: ../..
  dockerfile: infrastructure/docker/Dockerfile.training
  args:
    BASE_IMAGE: ${PADDLEX_GPU_IMAGE:-ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlex/paddlex:paddlex3.3.11-paddlepaddle3.2.0-gpu-cuda11.8-cudnn8.9-trt8.6}
    PADDLEX_SOURCE_VERSION: ${PADDLEX_SOURCE_VERSION:-3.7.2}
    PADDLEX_SOURCE_URL: ${PADDLEX_SOURCE_URL:-https://files.pythonhosted.org/packages/dd/96/1e86d4056ffc1e494c53aebab7e2faf08dcf8b929180f9872ae46632e9bd/paddlex-3.7.2.tar.gz}
    PADDLEX_SOURCE_SHA256: ${PADDLEX_SOURCE_SHA256:-6a60b4595e2d51460f7f51326672adca86b89ff9ecfd02ac348fb69739e0093c}
    PADDLE_PACKAGE: ${PADDLE_GPU_PACKAGE:-paddlepaddle-gpu==3.2.2}
    PADDLE_INDEX_URL: ${PADDLE_GPU_INDEX_URL:-https://www.paddlepaddle.org.cn/packages/stable/cu118/}
    INSTALL_PADDLEDETECTION: "0"
    APP_UID: ${ISALA_APP_UID:-10001}
    APP_GID: ${ISALA_APP_GID:-10001}

x-training-gpu-detection-build: &training-gpu-detection-build
  context: ../..
  dockerfile: infrastructure/docker/Dockerfile.training
  args:
    BASE_IMAGE: ${PADDLEX_GPU_IMAGE:-ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlex/paddlex:paddlex3.3.11-paddlepaddle3.2.0-gpu-cuda11.8-cudnn8.9-trt8.6}
    PADDLEX_SOURCE_VERSION: ${PADDLEX_SOURCE_VERSION:-3.7.2}
    PADDLEX_SOURCE_URL: ${PADDLEX_SOURCE_URL:-https://files.pythonhosted.org/packages/dd/96/1e86d4056ffc1e494c53aebab7e2faf08dcf8b929180f9872ae46632e9bd/paddlex-3.7.2.tar.gz}
    PADDLEX_SOURCE_SHA256: ${PADDLEX_SOURCE_SHA256:-6a60b4595e2d51460f7f51326672adca86b89ff9ecfd02ac348fb69739e0093c}
    PADDLE_PACKAGE: ${PADDLE_GPU_PACKAGE:-paddlepaddle-gpu==3.2.2}
    PADDLE_INDEX_URL: ${PADDLE_GPU_INDEX_URL:-https://www.paddlepaddle.org.cn/packages/stable/cu118/}
    INSTALL_PADDLEDETECTION: "1"
    APP_UID: ${ISALA_APP_UID:-10001}
    APP_GID: ${ISALA_APP_GID:-10001}

services:
  model-prep:
    image: "isalaocr-runtime:${ISALA_APP_IMAGE_VERSION:-3.14.1}"
    build: *runtime-build
    profiles: ["setup"]
    environment:
      PADDLE_PDX_CACHE_HOME: /models/paddlex
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    volumes:
      - ../../models:/models
      - ../../application/config:/app/config:ro
      - ../../automation/training_runtime:/opt/isala-training:ro
    command: ["download-models", "--config", "/app/config/app.yaml"]
    <<: *runtime-security

  model-prep-offline:
    image: "isalaocr-runtime:${ISALA_APP_IMAGE_VERSION:-3.14.1}"
    profiles: ["setup"]
    network_mode: none
    environment:
      PADDLE_PDX_CACHE_HOME: /models/paddlex
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    volumes:
      - ../../models:/models
      - ../../application/config:/app/config:ro
      - ../../automation/training_runtime:/opt/isala-training:ro
    command: ["download-models", "--config", "/app/config/app.yaml"]
    <<: *runtime-security

  ocr:
    image: "isalaocr-runtime:${ISALA_APP_IMAGE_VERSION:-3.14.1}"
    network_mode: none
    read_only: true
    environment:
      PADDLE_PDX_CACHE_HOME: /models/paddlex
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      HOME: /tmp
    volumes:
      - ../../input:/input:ro
      - ../../output:/output
      - ../../models:/models
      - ../../application/config:/app/config:ro
    tmpfs: ["/tmp:size=2g,mode=1777"]
    command: ["process", "--input", "/input", "--output", "/output", "--config", "/app/config/app.yaml"]
    <<: *runtime-security
    pids_limit: 256
    restart: "no"

  training-collector:
    image: "isalaocr-runtime:${ISALA_APP_IMAGE_VERSION:-3.14.1}"
    profiles: ["training"]
    network_mode: none
    read_only: true
    environment:
      ISALA_PROJECT_ID: ${ISALA_PROJECT_ID:-}
      PADDLE_PDX_CACHE_HOME: /models/paddlex
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      HOME: /tmp
    volumes:
      - ../../input:/input:ro
      - ../../models:/models
      - ../../application/config:/app/config:ro
      - ../../training:/training
    tmpfs: ["/tmp:size=2g,mode=1777"]
    command: ["collect-training", "--input", "/input", "--workspace", "/training/workspace", "--config", "/app/config/app.yaml"]
    <<: *runtime-security
    pids_limit: 256

  labeler:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.labeler
    image: isalaocr-labeler:3.14.1
    profiles: ["training"]
    read_only: true
    environment:
      HOME: /tmp
    volumes:
      - ../../input:/input:ro
      - ../../output:/output:ro
      - ../../models:/models:ro
      - ../../training:/training
      - ../../project:/project:ro
      - ../../application/config:/app/config:ro
    tmpfs: ["/tmp:size=256m,mode=1777"]
    command: ["--workspace", "/training/workspace", "--models", "/models", "--output", "/output", "--project", "/project", "--config", "/app/config/app.yaml", "--host", "0.0.0.0", "--port", "8088"]
    ports:
      - "127.0.0.1:${ISALA_LABEL_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s
    networks: ["local-label-ui"]
    <<: *runtime-security
    pids_limit: 128

  dataset-builder:
    image: "isalaocr-runtime:${ISALA_APP_IMAGE_VERSION:-3.14.1}"
    profiles: ["training"]
    network_mode: none
    read_only: true
    environment:
      ISALA_PROJECT_ID: ${ISALA_PROJECT_ID:-}
      HOME: /tmp
    volumes:
      - ../../training:/training
      - ../../application/config:/app/config:ro
      - ../../automation/training_runtime:/opt/isala-training:ro
    tmpfs: ["/tmp:size=1g,mode=1777"]
    command: ["build-dataset", "--workspace", "/training/workspace", "--config", "/app/config/app.yaml"]
    <<: *runtime-security

  evaluator:
    image: "isalaocr-runtime:${ISALA_APP_IMAGE_VERSION:-3.14.1}"
    profiles: ["training"]
    network_mode: none
    read_only: true
    environment:
      ISALA_PROJECT_ID: ${ISALA_PROJECT_ID:-}
      PADDLE_PDX_CACHE_HOME: /models/paddlex
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      HOME: /tmp
    volumes:
      - ../../training:/training
      - ../../models:/models
      - ../../application/config:/app/config:ro
    tmpfs: ["/tmp:size=2g,mode=1777"]
    entrypoint: ["python", "-m", "isala_ocr"]
    command: ["--help"]
    <<: *runtime-security
    pids_limit: 256

  model-manager:
    image: "isalaocr-runtime:${ISALA_APP_IMAGE_VERSION:-3.14.1}"
    profiles: ["training"]
    network_mode: none
    read_only: true
    environment:
      ISALA_PROJECT_ID: ${ISALA_PROJECT_ID:-}
      HOME: /tmp
    volumes:
      - ../../training:/training
      - ../../models:/models
      - ../../application/config:/app/config:ro
    tmpfs: ["/tmp:size=256m,mode=1777"]
    entrypoint: ["python", "-m", "isala_ocr"]
    command: ["--help"]
    <<: *runtime-security

  training-image-cpu:
    image: "isalaocr-training-cpu:${ISALA_TRAINING_IMAGE_VERSION:-3.8.4}"
    build: *training-cpu-build
    profiles: ["training-build"]
    command: ["--help"]

  training-image-gpu:
    image: "isalaocr-training-gpu:${ISALA_TRAINING_IMAGE_VERSION:-3.8.4}"
    build: *training-gpu-build
    profiles: ["training-build"]
    command: ["--help"]

  training-image-gpu-detection:
    image: "isalaocr-training-gpu-detection:${ISALA_TRAINING_IMAGE_VERSION:-3.8.4}"
    build: *training-gpu-detection-build
    profiles: ["training-build"]
    command: ["--help"]

  localization-model-prep:
    image: "isalaocr-training-cpu:${ISALA_TRAINING_IMAGE_VERSION:-3.8.4}"
    user: "${ISALA_APP_UID:-10001}:${ISALA_APP_GID:-10001}"
    profiles: ["setup"]
    environment: *training-environment
    volumes:
      - ../../models:/models
      - ../../training:/training
      - ../../automation/training_runtime:/opt/isala-training:ro
    entrypoint: ["python3", "/opt/isala-training/localization_runner.py"]
    command: ["prepare", "--manifest", "/models/paddlex/isala_localization_model_manifest.json"]
    <<: *runtime-security

  localization-model-check:
    image: "isalaocr-training-cpu:${ISALA_TRAINING_IMAGE_VERSION:-3.8.4}"
    user: "${ISALA_APP_UID:-10001}:${ISALA_APP_GID:-10001}"
    profiles: ["setup"]
    network_mode: none
    environment: *training-environment
    volumes:
      - ../../models:/models
      - ../../training:/training
      - ../../automation/training_runtime:/opt/isala-training:ro
    entrypoint: ["python3", "/opt/isala-training/localization_runner.py"]
    command: ["prepare", "--manifest", "/models/paddlex/isala_localization_model_manifest.json"]
    <<: *runtime-security

  training-setup:
    image: "isalaocr-training-cpu:${ISALA_TRAINING_IMAGE_VERSION:-3.8.4}"
    user: "${ISALA_APP_UID:-10001}:${ISALA_APP_GID:-10001}"
    profiles: ["training-setup"]
    network_mode: none
    environment: *training-environment
    volumes:
      - ../../models:/models
      - ../../training:/training
      - ../../automation/training_runtime:/opt/isala-training:ro
    command: ["prepare", "--offline", "--model", "PP-OCRv6_medium_rec", "--pretrain-root", "/models/training", "--model-cache", "/models/paddlex"]
    <<: *runtime-security

  trainer-cpu:
    image: "isalaocr-training-cpu:${ISALA_TRAINING_IMAGE_VERSION:-3.8.4}"
    user: "${ISALA_APP_UID:-10001}:${ISALA_APP_GID:-10001}"
    profiles: ["training"]
    network_mode: none
    shm_size: 8gb
    environment: *training-environment
    volumes:
      - ../../training:/training
      - ../../models:/models
      - ../../automation/training_runtime:/opt/isala-training:ro
    command: ["--help"]
    <<: *runtime-security

  trainer-gpu:
    image: "isalaocr-training-gpu:${ISALA_TRAINING_IMAGE_VERSION:-3.8.4}"
    user: "${ISALA_APP_UID:-10001}:${ISALA_APP_GID:-10001}"
    profiles: ["training-gpu"]
    network_mode: none
    shm_size: 8gb
    gpus: all
    environment: *training-environment
    volumes:
      - ../../training:/training
      - ../../models:/models
      - ../../automation/training_runtime:/opt/isala-training:ro
    command: ["--help"]
    <<: *runtime-security

  trainer-gpu-detection:
    image: "isalaocr-training-gpu-detection:${ISALA_TRAINING_IMAGE_VERSION:-3.8.4}"
    user: "${ISALA_APP_UID:-10001}:${ISALA_APP_GID:-10001}"
    profiles: ["training-gpu-detection"]
    network_mode: none
    shm_size: 8gb
    gpus: all
    environment: *training-environment
    volumes:
      - ../../training:/training
      - ../../models:/models
      - ../../automation/training_runtime:/opt/isala-training:ro
    command: ["--help"]
    <<: *runtime-security

  workspace-doctor:
    image: "isalaocr-training-cpu:${ISALA_TRAINING_IMAGE_VERSION:-3.8.4}"
    user: "${ISALA_APP_UID:-10001}:${ISALA_APP_GID:-10001}"
    profiles: ["doctor"]
    network_mode: none
    environment:
      HOME: /tmp
      TMPDIR: /tmp
      ISALA_APP_UID: ${ISALA_APP_UID:-10001}
      ISALA_APP_GID: ${ISALA_APP_GID:-10001}
      ISALA_PROJECT_ID: ${ISALA_PROJECT_ID:-}
    volumes:
      - ../../input:/input:ro
      - ../../output:/output
      - ../../models:/models
      - ../../training:/training
      - ../../automation/training_runtime:/opt/isala-training:ro
    entrypoint: ["python3", "/opt/isala-training/workspace_doctor.py"]
    command: ["check", "--json"]
    <<: *runtime-security

  workspace-repair:
    image: "isalaocr-training-cpu:${ISALA_TRAINING_IMAGE_VERSION:-3.8.4}"
    user: "0:0"
    profiles: ["doctor"]
    network_mode: none
    environment:
      HOME: /tmp
      TMPDIR: /tmp
      ISALA_APP_UID: ${ISALA_APP_UID:-10001}
      ISALA_APP_GID: ${ISALA_APP_GID:-10001}
      ISALA_PROJECT_ID: ${ISALA_PROJECT_ID:-}
    volumes:
      - ../../output:/output
      - ../../models:/models
      - ../../training:/training
      - ../../automation/training_runtime:/opt/isala-training:ro
    entrypoint: ["python3", "/opt/isala-training/workspace_doctor.py"]
    command: ["repair", "--json"]
    security_opt: ["no-new-privileges:true"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]